name: GSE114007 human cartilage counts inspection

on:
  push:
    paths:
      - '.github/workflows/run-deseq2.yml'
      - 'GSE114007_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install xlsx parser
        run: python -m pip install --break-system-packages openpyxl
      - name: Inspect GSE114007 raw counts and IRF7
        run: |
          set -o pipefail
          python -u GSE114007_probe.py 2>&1 | tee GSE114007_probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GSE114007-inspection
          path: |
            results/GSE114007/GSE114007_probe.json
            GSE114007_probe.log
