name: GSE89408 synovial IRF7 native DESeq2
on:
  push:
    paths:
      - '.github/workflows/run-gse89408.yml'
      - 'GSE89408_IRF7_native_DESeq2.R'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deseq2:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Download GEO original count matrix
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 4 --connect-timeout 25 --max-time 280 \
            'https://ftp.ncbi.nlm.nih.gov/geo/series/GSE89nnn/GSE89408/suppl/GSE89408_GEO_count_matrix_rename.txt.gz' \
            -o GSE89408_GEO_count_matrix_rename.txt.gz
          gzip -t GSE89408_GEO_count_matrix_rename.txt.gz
          ls -lh GSE89408_GEO_count_matrix_rename.txt.gz
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            bioc::DESeq2
      - name: Run native DESeq2 OA vs Healthy
        shell: bash
        run: |
          set -o pipefail
          Rscript GSE89408_IRF7_native_DESeq2.R 2>&1 | tee GSE89408_DESeq2.log
      - name: Upload all results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GSE89408-IRF7-native-DESeq2-results
          path: |
            results/GSE89408/
            GSE89408_DESeq2.log
          if-no-files-found: warn
