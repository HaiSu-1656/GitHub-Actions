name: SPARC457 public API probe
on:
  push:
    paths:
      - '.github/workflows/sparc457-probe.yml'
      - 'SPARC457_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python -u SPARC457_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SPARC457-api-probe
          path: results/SPARC457_api_probe/
          if-no-files-found: warn
